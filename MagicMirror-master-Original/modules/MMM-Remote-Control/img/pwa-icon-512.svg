<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#1a1a1a" rx="64"/>
  
  <!-- Mirror frame (outer) -->
  <ellipse cx="256" cy="256" rx="180" ry="200" fill="#333" stroke="#555" stroke-width="8"/>
  
  <!-- Mirror glass -->
  <ellipse cx="256" cy="256" rx="160" ry="180" fill="#0a0a0a" opacity="0.9"/>
  
  <!-- Reflection effect -->
  <ellipse cx="256" cy="220" rx="140" ry="100" fill="url(#gradient)" opacity="0.3"/>
  
  <!-- Smart indicators (LEDs) -->
  <circle cx="256" cy="140" r="8" fill="#00ff88"/>
  <circle cx="220" cy="150" r="6" fill="#0088ff" opacity="0.8"/>
  <circle cx="292" cy="150" r="6" fill="#ff0088" opacity="0.8"/>
  
  <!-- Text -->
  <text x="256" y="400" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#fff" text-anchor="middle">DM</text>
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="24" fill="#00ff88" text-anchor="middle">Remote</text>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>
